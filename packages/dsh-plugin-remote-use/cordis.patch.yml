# Bundle patch for dsh-plugin-remote-use.
#
# The row id is the plugin's stable identity in the Settings page and in the profile
# patch, so keep it stable across versions.
#
# ---------------------------------------------------------------------------
# NO TOOL ROW IS NEEDED, and this package deliberately has none.
#
# Earlier versions told the operator to add one `@deepseek-ai/dsh-tool-subagent` row per
# worker, with `provider: remote-<id>`. That instruction was WRONG, and following it ended
# with a configured worker, a restart, and still no tool for the model (PITFALLS F11).
#
# WHY: a Web session's model-facing tool catalog is enumerated by the AGENT PRESET
# (`preset-standard.plugins`), not by the loader tree. Such a row does compose -- the
# official `dsh --dump-config` shows it in the tree -- and still never reaches the model,
# because the preset does not list it. Registering a provider and exposing a tool are two
# different mechanisms, and only the second decides what the model can call.
#
# The plugin therefore registers `remote_subagent` itself through `ctx.tools.register()`,
# alongside its four `remote_*` observation tools. Adding a worker in the Settings page is
# the whole job: no profile edit, and no restart.
#
# `workers: []` here is only a default. The Settings page writes the real list to
# ~/.dsh/storages/dsh-plugin-remote-use/settings.json, which OVERRIDES this row.
# ---------------------------------------------------------------------------

# `id` is the ROW identity -- this plugin's stable name in the Settings page, and what a profile
# patch refers to when it overrides this row's config. It deliberately does NOT have to match the
# package name, and changing it would break every profile that already points at it.
#
# `name` is the MODULE SPECIFIER -- what the loader imports. It MUST be the package name exactly,
# scope included. These two were the same string while the package was unscoped, which is why
# renaming the package to `@hope_phenom/dsh-plugin-remote-use` silently broke the plugin: the
# manager still listed it (it reads package.json) and the toggle still moved, but the loader tried
# to import `dsh-plugin-remote-use`, found nothing under that name, and the server half never
# loaded -- so the Settings section never appeared.
- insert:
    - id: dsh-plugin-remote-use
      name: '@hope_phenom/dsh-plugin-remote-use'
      config:
        workers: []
